name: Scrape Pamphlets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Scraper Script
        run: python scraper.py

      - name: Show Log in Actions
        if: always()
        run: |
          echo "=== Final Folder ==="
          ls -l pamphletTXT/

      - name: Final Sync (Fix rejected error)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add pamphletTXT/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Final sync pamphletTXT"
          git push || (git pull --rebase origin main && git push) || echo "Nothing to push"
