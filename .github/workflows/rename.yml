name: Rename Pamphlets to Bangla

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rename important_{number}.txt to Bangla
        run: |
          echo "=== Before ==="
          ls -l pamphletTXT/
          echo ""
          echo "=== Mapping ==="
          cat pamphlet_names.txt
          echo ""
          python rename.py

      - name: Show After
        if: always()
        run: ls -l pamphletTXT/

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pamphletTXT/
          git diff --quiet && git diff --staged --quiet || git commit -m "Rename important_{number} to Bangla names"
          git push
