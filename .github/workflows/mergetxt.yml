name: Merge tafsirpart files

on:
  workflow_dispatch:
    inputs:
      output_filename:
        description: 'Output file er naam ki hobe? (ex: complete.txt)'
        required: true
        default: 'merged_tafsir.txt'
        type: string

permissions:
  contents: write

jobs:
  merge-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tafsirpart folder
        run: |
          ls -l tafsirpart/
          ls tafsirpart/part*.txt | wc -l

      - name: Merge part files in numeric order
        env:
          OUTPUT_NAME: ${{ inputs.output_filename }}
        run: |
          mkdir -p txt
          OUTPUT_PATH="txt/$OUTPUT_NAME"
          echo "Merging to: $OUTPUT_PATH"

          python3 << 'PY'
          import glob, re, os
          output_name = os.getenv('OUTPUT_NAME')
          output_path = f"txt/{output_name}"

          files = glob.glob('tafsirpart/part*.txt')

          def get_num(f):
              m = re.search(r'part\[?(\d+)\]?', f)
              return int(m.group(1)) if m else 0

          files_sorted = sorted(files, key=get_num)
          print(f"Found files: {files_sorted}")

          if not files_sorted:
              print("ERROR: file not found!")
              exit(1)

          with open(output_path, 'w', encoding='utf-8') as outfile:
              for fname in files_sorted:
                  with open(fname, 'r', encoding='utf-8', errors='ignore') as infile:
                      outfile.write(infile.read())
                      outfile.write('\n')
          print(f"Done: {output_path}")
          PY

          ls -lh "$OUTPUT_PATH"
          wc -l "$OUTPUT_PATH"

      - name: Commit and push merged file
        env:
          OUTPUT_NAME: ${{ inputs.output_filename }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          OUTPUT_PATH="txt/$OUTPUT_NAME"

          # Quote use kora holo - ekhane ar error hobe na
          git add "$OUTPUT_PATH"
          git diff --staged --quiet || git commit -m "Merge tafsirpart into $OUTPUT_NAME"
          git push
