name: Merge tafsirpart files

on:
  workflow_dispatch:
    inputs:
      output_filename:
        description: 'Output file er naam ki hobe? (ex: complete.txt)'
        required: true
        default: 'merged_tafsir.txt'
        type: string

permissions:
  contents: write

jobs:
  merge-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tafsirpart folder
        run: |
          echo "Checking files in tafsirpart/"
          ls -l tafsirpart/
          echo "Total files: $(ls tafsirpart/part*.txt 2>/dev/null | wc -l)"

      - name: Merge part files in numeric order
        run: |
          mkdir -p txt
          OUTPUT_FILE="txt/${{ inputs.output_filename }}"

          echo "Merging files to $OUTPUT_FILE..."

          # part[1].txt and part1.txt both support korbe
          python3 << 'PY'
          import glob, re, os
          output_file = os.environ.get("OUTPUT_FILE", "txt/merged_tafsir.txt")
          # Use input from env
          import pathlib
          # Get output path from github input
          output_path = f"txt/{os.getenv('OUTPUT_NAME')}"

          files = glob.glob('tafsirpart/part*.txt')

          def get_num(f):
              m = re.search(r'part\[?(\d+)\]?', f)
              return int(m.group(1)) if m else 0

          files_sorted = sorted(files, key=get_num)
          print(f"Found {len(files_sorted)} files in order: {files_sorted}")

          if not files_sorted:
              print("ERROR: tafsirpart/part*.txt kono file pai ni!")
              exit(1)

          with open(output_path, 'w', encoding='utf-8') as outfile:
              for fname in files_sorted:
                  print(f"Merging: {fname}")
                  with open(fname, 'r', encoding='utf-8', errors='ignore') as infile:
                      outfile.write(infile.read())
                      outfile.write('\n')

          print(f"Merge complete -> {output_path}")
          PY
        env:
          OUTPUT_NAME: ${{ inputs.output_filename }}

      - name: Show result
        run: |
          ls -lh "txt/${{ inputs.output_filename }}"
          wc -l "txt/${{ inputs.output_filename }}"

      - name: Commit and push merged file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add txt/${{ inputs.output_filename }}
          git diff --staged --quiet || git commit -m "Merge tafsirpart into ${{ inputs.output_filename }}"
          git push
