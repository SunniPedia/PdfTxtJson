name: Remove url from file.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove url field from file.json
        run: |
          echo "Before:"
          cat booklist/file.json

          # যদি file.json একটা single object হয় -> del(.url)
          # যদি file.json একটা array of objects হয় -> map(del(.url))
          # এই command দুটো case ই handle করবে
          jq 'if type == "array" then map(del(.2)) else del(.2) end' booklist/file.json > /tmp/file.json
          mv /tmp/file.json booklist/file.json

          echo "After:"
          cat booklist/file.json

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add booklist/file.json
            git commit -m "chore: remove url field from booklist/file.json"
            git push
          fi
