name: Remove key 2 from file.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove key "2" from file.json
        run: |
          echo "Before:"
          cat booklist/file.json

          # key "2" বাদ দেয়ার জন্য
          jq 'if type == "array" then map(del(.["2"])) else del(.["2"]) end' booklist/file.json > /tmp/file.json
          mv /tmp/file.json booklist/file.json

          echo "After:"
          cat booklist/file.json

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add booklist/file.json
            git commit -m "chore: remove key 2 from booklist/file.json"
            git push
          fi
