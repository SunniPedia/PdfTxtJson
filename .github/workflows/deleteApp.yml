name: Cleanup Matched Pamphlet TXT

on:
  workflow_dispatch:
  push:
    paths:
      - 'pamphletTXT/**'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch JSON and Delete Matched TXT Files
        run: |
          python3 << 'PY'
          import os
          import json
          import glob
          import urllib.request
          from pathlib import Path

          CDN_URL = "https://cdn.jsdelivr.net/gh/srizwan198704-dev/IslamiEncyclopedia@main/app/src/main/assets/file.json"
          FOLDER = "pamphletTXT"

          print(f"Fetching JSON from: {CDN_URL}")
          with urllib.request.urlopen(CDN_URL) as response:
              data = json.loads(response.read().decode('utf-8'))

          # json থেকে সব name এর লিস্ট বানাও
          json_names = set()
          for item in data:
              name = str(item.get("name", "")).strip()
              if name:
                  json_names.add(name)
          
          print(f"Found {len(json_names)} names in JSON")

          # pamphletTXT ফোল্ডারের সব txt ফাইল
          txt_files = glob.glob(f"{FOLDER}/*.txt")
          print(f"Found {len(txt_files)} txt files in {FOLDER}")

          deleted_count = 0
          for txt_path in txt_files:
              p = Path(txt_path)
              file_name_without_ext = p.stem.strip()
              
              if file_name_without_ext in json_names:
                  print(f"Matched & Deleting: {txt_path}")
                  os.remove(txt_path)
                  deleted_count += 1
          
          print(f"Total deleted: {deleted_count}")
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DELETED_COUNT={deleted_count}\n")
          PY

      - name: Commit and Push if Deleted
        run: |
          if [ "$DELETED_COUNT" -gt 0 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto deleted $DELETED_COUNT matched pamphletTXT files"
            git push
          else
            echo "No file matched, nothing to delete."
          fi
